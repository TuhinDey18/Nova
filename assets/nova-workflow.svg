<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1500" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">N.O.V.A. animated workflow diagram</title>
  <desc id="desc">Three stages: video ingestion and indexing, multimodal search and timeline generation, then conversational investigation and the final answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#86EFAC"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop stop-color="#FCD34D"/><stop offset="1" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="rose" x1="0" x2="1"><stop stop-color="#FDA4AF"/><stop offset="1" stop-color="#F43F5E"/></linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94A3B8"/></marker>
    <style>.title{font:700 26px Arial,sans-serif;fill:#F8FAFC}.subtitle{font:500 14px Arial,sans-serif;fill:#94A3B8;letter-spacing:2px}.stage{font:700 15px Arial,sans-serif;fill:#CBD5E1;letter-spacing:1.4px;text-anchor:middle}.nodeTitle{font:700 22px Arial,sans-serif;fill:#F8FAFC;text-anchor:middle}.nodeSub{font:500 15px Arial,sans-serif;fill:#CBD5E1;text-anchor:middle}.node{fill:#111827;stroke-width:2}.flow{fill:none;stroke:#94A3B8;stroke-width:3;stroke-linecap:round;stroke-dasharray:10 14;animation:dash 1.5s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dash{to{stroke-dashoffset:-48}}@keyframes pulse{50%{transform:scale(1.025)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
  </defs>
  <rect width="900" height="1500" rx="40" fill="url(#bg)"/>
  <text x="68" y="66" class="title">N.O.V.A. WORKFLOW</text><text x="68" y="94" class="subtitle">NETWORKED OBSERVATION &amp; VISUAL ANALYTICS</text>
  <circle cx="825" cy="70" r="8" fill="#34D399" filter="url(#glow)"><animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/></circle><text x="790" y="76" class="subtitle" style="font-size:11px">ACTIVE</text>
  <rect x="48" y="137" width="210" height="400" rx="24" fill="#172554" stroke="#3B82F6" stroke-width="2"/><text x="153" y="230" class="stage">STAGE 1</text><text x="153" y="261" class="stage">INGESTION</text><text x="153" y="292" class="stage">&amp; INDEXING</text>
  <path d="M500 220V272" class="flow" marker-end="url(#arrow)"/><path d="M500 362V414" class="flow" marker-end="url(#arrow)"/><path d="M500 504V556" class="flow" marker-end="url(#arrow)"/>
  <g class="pulse"><rect x="330" y="130" width="340" height="90" rx="18" class="node" stroke="url(#blue)"/><text x="500" y="168" class="nodeTitle">▣  Video Capture</text><text x="500" y="194" class="nodeSub">networked camera feeds</text></g>
  <g class="pulse" style="animation-delay:.2s"><rect x="330" y="272" width="340" height="90" rx="18" class="node" stroke="url(#green)"/><text x="500" y="310" class="nodeTitle">◎  Detection</text><text x="500" y="336" class="nodeSub">YOLOv11 detection + tracking</text></g>
  <g class="pulse" style="animation-delay:.4s"><rect x="330" y="414" width="340" height="90" rx="18" class="node" stroke="url(#amber)"/><text x="500" y="452" class="nodeTitle">▣  Crop + Embed</text><text x="500" y="478" class="nodeSub">visual evidence → CLIP vectors</text></g>
  <g class="pulse" style="animation-delay:.6s"><rect x="330" y="556" width="340" height="90" rx="18" class="node" stroke="url(#violet)"/><text x="500" y="594" class="nodeTitle">◉  Evidence Store</text><text x="500" y="620" class="nodeSub">FAISS index + SQLite audit trail</text></g>
  <path d="M48 704H852" stroke="#475569" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="48" y="762" width="210" height="400" rx="24" fill="#172554" stroke="#3B82F6" stroke-width="2"/><text x="153" y="845" class="stage">STAGE 2</text><text x="153" y="876" class="stage">MULTIMODAL</text><text x="153" y="907" class="stage">SEARCH &amp;</text><text x="153" y="938" class="stage">TIMELINE</text>
  <path d="M500 845V897" class="flow" marker-end="url(#arrow)"/><path d="M500 987V1039" class="flow" marker-end="url(#arrow)"/><path d="M500 1129V1181" class="flow" marker-end="url(#arrow)"/><path d="M670 601H752V942H670" class="flow" marker-end="url(#arrow)"/>
  <g class="pulse"><rect x="330" y="755" width="340" height="90" rx="18" class="node" stroke="url(#rose)"/><text x="500" y="793" class="nodeTitle">♙  User Query</text><text x="500" y="819" class="nodeSub">reference image or target object</text></g>
  <g class="pulse" style="animation-delay:.2s"><rect x="330" y="897" width="340" height="90" rx="18" class="node" stroke="url(#green)"/><text x="500" y="935" class="nodeTitle">⌕  Similarity Search</text><text x="500" y="961" class="nodeSub">FAISS visual-match retrieval</text></g>
  <g class="pulse" style="animation-delay:.4s"><rect x="330" y="1039" width="340" height="90" rx="18" class="node" stroke="url(#amber)"/><text x="500" y="1077" class="nodeTitle">⊙  Investigative Timeline</text><text x="500" y="1103" class="nodeSub">group tracks · reconstruct journey</text></g>
  <g class="pulse" style="animation-delay:.6s"><rect x="330" y="1181" width="340" height="90" rx="18" class="node" stroke="url(#violet)"/><text x="500" y="1219" class="nodeTitle">▤  Report Generation</text><text x="500" y="1245" class="nodeSub">evidence-backed case report</text></g>
  <rect x="48" y="1330" width="804" height="118" rx="24" fill="#172554" stroke="#3B82F6" stroke-width="2"/><text x="150" y="1374" class="stage">STAGE 3</text><text x="150" y="1403" class="stage">CONVERSATION</text><text x="150" y="1432" class="stage">&amp; ATTRIBUTE</text>
  <path d="M310 1386H377" class="flow" marker-end="url(#arrow)"/><path d="M523 1386H590" class="flow" marker-end="url(#arrow)"/><path d="M670 1226H742V1337" class="flow" marker-end="url(#arrow)"/>
  <g class="pulse"><rect x="285" y="1342" width="180" height="88" rx="18" class="node" stroke="url(#green)"/><text x="375" y="1378" class="nodeTitle" style="font-size:18px">User Prompt</text><text x="375" y="1404" class="nodeSub" style="font-size:13px">investigator asks</text></g>
  <g class="pulse" style="animation-delay:.25s"><rect x="505" y="1342" width="180" height="88" rx="18" class="node" stroke="url(#amber)"/><text x="595" y="1378" class="nodeTitle" style="font-size:18px">Context</text><text x="595" y="1404" class="nodeSub" style="font-size:13px">report injection</text></g>
  <g class="pulse" style="animation-delay:.5s"><rect x="725" y="1342" width="100" height="88" rx="18" class="node" stroke="url(#violet)"/><text x="775" y="1378" class="nodeTitle" style="font-size:16px">LLM</text><text x="775" y="1404" class="nodeSub" style="font-size:12px">answer</text></g>
  <g fill="#F8FAFC" filter="url(#glow)"><circle r="6"><animateMotion dur="2s" repeatCount="indefinite" path="M500,220V272V362V414V504V556V646"/></circle></g><g fill="#F8FAFC" filter="url(#glow)"><circle r="6"><animateMotion dur="2s" begin=".6s" repeatCount="indefinite" path="M500,845V897V987V1039V1129V1181"/></circle></g>
</svg>
